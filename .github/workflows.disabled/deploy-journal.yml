name: Deploy Journal PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'journal-app'
      - 'journal-app/**'
      - '.github/workflows/deploy-journal.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      # journal-app re-exportiert @fitness-db/index.firestore.js komplett
      # (Wildcard) und bündelt zusätzlich habit-app (@habits, Timeline-Icons)
      # — beide ziehen fitness-apps generierten KB-Layer mit. Gitignored,
      # wird sonst nur von fitness-apps eigenem "prebuild"-Hook erzeugt.
      - name: Generate fitness KB data (transitive dependency via @fitness-db/@habits)
        run: pnpm --filter ./fitness-app run build:kb-data

      - name: Build Journal
        run: pnpm --filter ./journal-app run deploy:all:build

      # KEIN firestore:rules mehr: Rules-SSOT ist ~/vitalos/firestore.rules,
      # deployed nur von deploy-shell.yml. Per-App-Rules haben sich gegenseitig
      # überschrieben (journal-Rules ohne fitness/kb → Exercise-Suche tot).
      - name: Deploy Journal to Firebase Hosting
        run: |
          cd journal-app
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting:journal,hosting:v2,hosting:door,hosting:voice,hosting:game,hosting:tent \
            --project fitness-aos --non-interactive

      # Reminder Functions have their own isolated codebases and deploy workflow:
      # deploy-push-functions.yml (all / journal / fitness / vitalos).
