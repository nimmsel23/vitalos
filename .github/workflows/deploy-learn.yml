name: Deploy Learn PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'learn-app'
      - 'learn-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      # learn-app importiert fitness-app/src/lib/db/firestore/kb.js, und das zieht die
      # beim Fitness-Build erzeugten, gitignorierten *.generated.js (u.a.
      # exerciseBulkData.generated.js). Ohne diesen Schritt: "Could not resolve
      # ./exerciseBulkData.generated.js".
      - name: Fitness-KB-Daten erzeugen (von learn-app mitgenutzt)
        run: pnpm --filter ./fitness-app run build:kb-data

      - name: Build Learn
        run: pnpm --filter ./learn-app run build:firebase

      - name: Deploy Learn to Firebase Hosting
        run: |
          cd learn-app
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
