name: Deploy app push functions

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Reminder-Sender'
        type: choice
        options: [all, journal, fitness, vitalos]
        default: all
      verify_only:
        description: 'Deploy-Konto und gepinnte Quellpakete prüfen, nichts veröffentlichen'
        type: boolean
        default: false
      replace_gen1:
        description: 'Gen1-Funktion(en) des gewählten App vor dem Deploy löschen (Gen1→Gen2-Wechsel; kurze Scheduler-Lücke!)'
        type: boolean
        default: false

concurrency:
  group: production-push-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare deploy credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          credentials = json.loads(os.environ['FIREBASE_SA'])
          path = Path(os.environ['RUNNER_TEMP']) / 'push-deploy-sa.json'
          path.write_text(json.dumps(credentials))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'GOOGLE_APPLICATION_CREDENTIALS={path}\n')
          print('Deploy service account: ' + credentials['client_email'])
          PY
      - name: Read pinned backend source
        id: backend_source
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('.github/backend-functions.json').read_text())
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', pin['repository']), 'Invalid backend repository'
          assert re.fullmatch(r'[0-9a-f]{40}', pin['ref']), 'Backend source must be a full commit SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as target:
              target.write(f"repository={pin['repository']}\nref={pin['ref']}\n")
          PYCODE
      - name: Checkout pinned backend Functions
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.backend_source.outputs.repository }}
          ref: ${{ steps.backend_source.outputs.ref }}
          token: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}
          path: backend
          persist-credentials: false
      - name: Preserve Journal deploy parameters
        if: ${{ inputs.app == 'all' || inputs.app == 'journal' }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init journal-app
          # Preserve existing Firebase params; never print or commit their contents.
          if [ -f journal-app/functions/.env.fitness-aos ]; then
            cp journal-app/functions/.env.fitness-aos backend/functions/journal/.env.fitness-aos
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate selected deployment inputs without loading function code
        env:
          PUSH_APP: ${{ inputs.app }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          pin = json.loads(Path('.github/backend-functions.json').read_text())
          actual = subprocess.check_output(['git', '-C', 'backend', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == pin['ref'], 'Backend checkout does not match the deployment pin'
          selection = os.environ['PUSH_APP']
          assert selection in ('all', 'fitness', 'journal', 'vitalos'), 'Invalid app'
          apps = ('vitalos', 'fitness', 'journal') if selection == 'all' else (selection,)
          sources = {entry['codebase']: entry for entry in json.loads(Path('firebase.push.json').read_text())['functions']}
          backend_sources = {entry['codebase']: entry for entry in json.loads(Path('backend/firebase.json').read_text())['functions']}
          for app in apps:
              entry = sources[app]
              source = Path(entry['source'])
              package = json.loads((source / 'package.json').read_text())
              assert (source / package.get('main', 'index.js')).is_file(), f'{app}: missing function entrypoint'
              assert entry['runtime'] == 'nodejs22', f'{app}: unexpected runtime'
              if app != 'vitalos':
                  assert source == Path('backend') / backend_sources[app]['source'], f'{app}: backend and deploy manifests disagree'
              print(f"{app}: deployment package exists at {source}")
          PYCODE
      - name: Install and deploy selected reminder functions
        if: ${{ !inputs.verify_only }}
        env:
          PUSH_APP: ${{ inputs.app }}
        run: |
          node scripts/test-push-function-isolation.mjs
          case "$PUSH_APP" in
            all) apps="vitalos fitness journal" ;;
            vitalos|fitness|journal) apps="$PUSH_APP" ;;
            *) echo 'Invalid app'; exit 1 ;;
          esac
          for app in $apps; do
            case "$app" in
              vitalos) source=functions; function=scheduledVitalosPushReminders ;;
              fitness) source=backend/functions/fitness; function=scheduledFitnessPushReminders ;;
              journal) source=backend/functions/journal; function=scheduledJournalPushReminders ;;
            esac
            if [ "$app" = vitalos ]; then
              npm ci --prefix "$source" --no-audit --no-fund
            else
              # Backend lockfiles are explicitly deferred during consolidation.
              npm install --prefix "$source" --workspaces=false --package-lock=false --no-audit --no-fund
            fi
            if [ "${{ inputs.replace_gen1 }}" = "true" ]; then
              npx --yes firebase-tools@15.34.0 functions:delete "$function" \
                --config firebase.push.json --project fitness-aos --non-interactive --force
            fi
            npx --yes firebase-tools@15.34.0 deploy \
              --config firebase.push.json --only "functions:$app:$function" \
              --project fitness-aos --non-interactive --force
          done
      - name: Remove temporary deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/push-deploy-sa.json"
