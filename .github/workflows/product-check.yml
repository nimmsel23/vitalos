name: Product shared-source preparation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'prod/**'
      - '.github/workflows/product-check.yml'
      - '.github/workflows/deploy-product-hosting.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
      - name: Fetch exact app pins
        env:
          GH_TOKEN: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check shared-source layout
        run: node prod/scripts/check-shared-layout.mjs
      - name: Check product Firebase boundaries
        run: node prod/scripts/check-product-boundaries.mjs
      - name: Record source manifest
        run: node prod/scripts/release-manifest.mjs > "$RUNNER_TEMP/product-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: product-source-manifest
          path: ${{ runner.temp }}/product-source.json

  product-build:
    needs: layout
    runs-on: ubuntu-latest
    steps:
      - name: Gate on product build secrets
        id: gate
        env:
          PID: ${{ secrets.VITE_VOS_FIREBASE_PROJECT_ID }}
          WEB: ${{ secrets.VITE_VOS_FIREBASE_WEB_CONFIG }}
          VAPID: ${{ secrets.VITE_VOS_FIREBASE_VAPID_KEY }}
        run: |
          if [ -z "$PID" ] || [ -z "$WEB" ] || [ -z "$VAPID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Produkt-Build-Secrets fehlen — Build übersprungen (Layout-Job bleibt der harte Gate)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.present == 'true'
        with:
          fetch-depth: 0
      - name: Private Skills submodule access
        if: steps.gate.outputs.present == 'true'
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
      - name: Fetch exact app pins
        if: steps.gate.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SUBMODULE_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.present == 'true'
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install (Workspaces)
        if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Product store build + isolation
        if: steps.gate.outputs.present == 'true'
        env:
          VITE_VOS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_VOS_FIREBASE_PROJECT_ID }}
          VITE_VOS_FIREBASE_WEB_CONFIG: ${{ secrets.VITE_VOS_FIREBASE_WEB_CONFIG }}
          VITE_VOS_FIREBASE_VAPID_KEY: ${{ secrets.VITE_VOS_FIREBASE_VAPID_KEY }}
        run: |
          if [ "$VITE_VOS_FIREBASE_PROJECT_ID" != "vitalos-prod" ]; then
            echo "::error::VITE_VOS_FIREBASE_PROJECT_ID must be vitalos-prod"
            exit 1
          fi
          pnpm run product:build
