# Deployt die projekt-globalen Rules: Firestore-Rules + Indexes und Storage-Rules
# (SSOT: Root-Dateien firestore.rules, firestore.indexes.json, storage.rules).
#
# Automatisch (seit 2026-11-21): nach jedem GRÜNEN Product-Check auf einem
# master-Push. Der Product-Check enthält den Pflicht-Job `firestore-rules`
# (Emulator-Test gegen Kontogrenzen) — ungetestete Rules gehen also nie live.
# Unveränderte Rules sind ein No-op ("already up to date").
# Historie: per-App-Rules-Deploys überschrieben sich gegenseitig und brachen
# am 16.07.2026 die Exercise-Suche (journal-Rules ohne fitness/kb-Match).
# Deshalb deployt NUR dieser Workflow Rules (Firestore + Storage), keine App-Repos.
#
# Manuell: gh workflow run deploy-firestore-rules.yml
# (oder GitHub → Actions → "Deploy Firestore Rules" → Run workflow)
# Alternativ lokal: firebase deploy --only firestore:rules,firestore:indexes,storage
# aus ~/vitalos (das Root-firebase.json ist das einzige mit firestore-Block).

name: Deploy Firestore Rules

on:
  workflow_run:
    workflows: ["Product shared-source preparation"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      seed_skills_catalog:
        description: Publish the pinned immutable Skills catalogue after deploying rules
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (ohne Submodules)
        uses: actions/checkout@v4
        with:
          # workflow_run: genau den geprüften Commit deployen, nicht master-HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: inputs.seed_skills_catalog
        with:
          node-version: 22
      - name: Skills submodule (public)
        if: inputs.seed_skills_catalog
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
      - name: Checkout pinned Skills catalogue
        if: inputs.seed_skills_catalog
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init fitness-app
          git -C fitness-app submodule update --init Skills
      - name: Deploy Firestore Rules & Indexes + Storage Rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,storage \
            --project fitness-aos --non-interactive

      - name: Publish immutable Skills catalogue
        if: inputs.seed_skills_catalog
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          seed_dir="$RUNNER_TEMP/skills-catalog-seed"
          mkdir -p "$seed_dir"
          npm install --prefix "$seed_dir" --ignore-scripts --no-audit --no-fund firebase-admin@14.5.0
          cp skills-app/scripts/seed-skills-catalog.mjs "$seed_dir/seed.mjs"
          printf '%s' "$FIREBASE_SA" > "$seed_dir/credentials.json"
          SKILLS_CATALOG_FILE="$GITHUB_WORKSPACE/skills-app/public/skills-catalog.v1.json" \
            GOOGLE_APPLICATION_CREDENTIALS="$seed_dir/credentials.json" \
            GCLOUD_PROJECT=fitness-aos node "$seed_dir/seed.mjs" --apply
