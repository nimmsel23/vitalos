# Abgelöst: GitHub Pages Root gehört dem Living Dev-Dashboard (dashboard.yml / engine).
# docs/ (inkl. apps.html, /prod/ Entwicklungsdashboard) liefert die Engine mit aus.
# workflow_dispatch bleibt als No-Op-Hinweis.
name: Pages Docs (abgelöst)

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Hinweis
        run: |
          echo "::error::Pages Root = Living Dashboard (dashboard.yml). Entwicklungsdashboard = docs/prod/ → /vitalos/prod/."
          exit 1
