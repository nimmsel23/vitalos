# Prod Living Dashboard (prod/dashboard) → docs/ → https://nimmsel23.github.io/vitalos/
# pages-docs.yml deployt danach nur docs/. deploy-shell ignoriert docs/**.
# Secret: PUBLIC_DENYLIST (kommagetrennte Klartextnamen).
name: Prod Living Dashboard → Pages

on:
  push:
    branches: [master]
    paths:
      - "prod/dashboard/**"
      - ".github/workflows/prod-dashboard-pages.yml"
  workflow_dispatch:

concurrency:
  group: prod-dashboard-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prod/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prod/dashboard/package-lock.json

      - name: Bauen
        run: npm ci && npm run build

      - name: Öffentlich = anonym (Sperrliste)
        env:
          DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          bash scripts/public-denylist.sh dist || {
            echo "::error::Im Prod-Dashboard Klarnamen in src/data.ts durch K-xx/T-xx ersetzen."
            exit 1
          }

      - name: Nach docs/ schreiben und pushen
        working-directory: .
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DIST="prod/dashboard/dist"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch 'docs/assets/index-*.js' 'docs/assets/index-*.css'
          mkdir -p docs/assets
          cp "$DIST/index.html" docs/index.html
          cp "$DIST"/assets/* docs/assets/
          git add docs/index.html docs/assets
          if git diff --cached --quiet; then
            echo "Keine Änderung am Prod Living Dashboard."
            exit 0
          fi
          git commit -q -m "docs(pages): Prod Living Dashboard aus prod/dashboard ${SRC_SHA:0:7}" \
            -m "Gebaut von .github/workflows/prod-dashboard-pages.yml."
          git push origin HEAD:master
