name: Deploy VOS Fitness PWA

# Ordner vos-fitness/ -> Hosting-Site `fitness-vos` (fitness-vos.web.app).
# Baut aus dem Meta-Repo, weil vos-fitness per Vite-Alias Quellen aus
# fitness-app (Branch vitalos) und den Geschwister-Apps importiert.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'vos-fitness/**'
      - 'fitness-app'
      - 'fitness-app/**'
      - 'firebase.config.js'
      - '.github/workflows/deploy-vos-fitness.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      # Generierte Daten, die fitness-app/6pack-Quellen beim Import erwarten
      # (wie das prebuild der Shell) — lokal liegen sie schon, in der CI nicht.
      - name: Generierte Daten (KB, 6pack)
        run: |
          pnpm run build:fitness-kb-data
          pnpm run build:6pack-data

      # vos-fitness ist kein Workspace-Mitglied -> vite aus dem Root-node_modules.
      - name: Push-SW aus fitness-app übernehmen (kein Drift der Kopie)
        working-directory: vos-fitness
        run: npm run sync:sw

      - name: Build VOS Fitness
        working-directory: vos-fitness
        env:
          VITE_APP_MODE: client
        run: ../node_modules/.bin/vite build --config vite.config.cjs

      # Mini-Apps (training, logbuch, review, atlas, touren, setup, anamnese, fokus) als Unterpfade DERSELBEN Origin
      # (fitness-vos.web.app/<id>/): gleicher Login, gleiche IndexedDB/Cache wie Pulse, keine neue Site/Auth-Domain.
      # Gebaut aus fitness-app (scripts/build-miniapps-origin.mjs, Tabelle scripts/miniapps.json). Ein Hosting-Deploy
      # ersetzt die ganze Site, deshalb gehört das in DIESEN Workflow und nicht in deploy-miniapps.yml (eigene Sites).
      - name: Mini-Apps als Unterpfade bauen
        working-directory: fitness-app
        run: node scripts/build-miniapps-origin.mjs

      - name: Mini-Apps in die Site übernehmen (+ Rewrites, sw.js no-cache)
        run: |
          set -euo pipefail
          src=fitness-app/dist-origin
          dst=vos-fitness/dist-firebase
          for d in "$src"/*/; do cp -r "$d" "$dst/$(basename "$d")"; done
          # Rewrites VOR den "**"-Catch-all, sw.js je Unterpfad nie cachen
          jq --slurpfile r "$src/_hosting-rewrites.json" \
            '.hosting.rewrites = ($r[0] + [.hosting.rewrites[] | select(.source == "**")])
             | .hosting.headers = ((.hosting.headers // []) + [{"source": "**/sw.js", "headers": [{"key": "Cache-Control", "value": "no-cache"}]}])' \
            vos-fitness/firebase.json > /tmp/firebase.merged.json
          mv /tmp/firebase.merged.json vos-fitness/firebase.json
          jq -c '.hosting' vos-fitness/firebase.json

      # Nur Hosting. Firestore-Rules-SSOT liegt im Root (deploy-shell.yml).
      - name: Deploy VOS Fitness to Firebase Hosting
        working-directory: vos-fitness
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
