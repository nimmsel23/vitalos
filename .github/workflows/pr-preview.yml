# PR-Preview für die VitalOS-Shell selbst (vitalos.web.app).
#
# Bewusst NUR für vitalos/src — die Submodule (fuel-app, fitness-app, ...)
# haben ihre eigene lokale Preview-Pipeline (pnpm run deploy:preview +
# Telegram-Link), die bleibt unangetastet. Dieser Workflow feuert nur,
# wenn sich die Shell selbst (src/, public/, Root-Configs) ändert.

name: PR Preview (VitalOS Shell)

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config*'
      - 'package.json'
      - 'firebase.json'

jobs:
  preview:
    runs-on: ubuntu-latest
    # Der Hosting-Deploy legt einen Check-Run an und kommentiert die Preview-URL.
    # Ohne diese Rechte bricht der Schritt mit 403 ab, bevor Firebase erreicht wird
    # (gleicher Fehler wie Lauf 41485323845 am 2026-11-02).
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (ohne Submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skills submodule (public)
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      # KB-SOT ist nimmsel23/fitness (öffentlich); fitness-dev hat fitness/catalog/kb seit 710fd66 nicht mehr.
      # Gleiches Muster wie fitness-dev check.yml / deploy-master.yml / preview-dev.yml.
      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB einhängen
        run: |
          set -euo pipefail
          mkdir -p fitness-app/fitness/catalog
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness-app/fitness/catalog/kb
          test -d fitness-app/fitness/catalog/kb/exercises/6pack
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      # fuel-app src/shared/* re-exportiert nach ../../../../backend/fuel/... (SOT nimmsel23/backend, privat).
      # Gleiches Muster wie fuel-dev check.yml / deploy-master.yml.
      - name: Checkout backend (fuel shared SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/backend
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      - name: Check embedded 6Pack auth
        run: node scripts/test-sixpack-auth.mjs

      - name: Build (firebase mode)
        run: pnpm run build:firebase

      - name: Deploy Preview Channel (vitalos)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          target: vitalos
          channelId: pr-${{ github.event.number }}
          expires: 7d
