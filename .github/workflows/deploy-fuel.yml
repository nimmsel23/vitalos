name: Deploy Fuel PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'fuel-app'
      - 'fuel-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      # fuel-app bündelt journal-app (Journal-Tab), journal-app bündelt
      # habit-app (Habit-Icons in der Timeline), habit-app importiert @db/
      # @utils → fuel-devs eigener @fitness-db-Re-Export → fitness-apps KB-
      # Layer. Diese generierte Datei ist gitignored und wird sonst nur
      # durch fitness-apps eigenen "prebuild"-Hook erzeugt (läuft nur bei
      # `pnpm --filter ./fitness-app run build`, nicht hier). Ohne diesen
      # Schritt schlägt der Build mit "Could not resolve
      # exerciseBulkData.generated.js" fehl.
      - name: Generate fitness KB data (transitive dependency via journal→habits)
        run: pnpm --filter ./fitness-app run build:kb-data

      - name: Firebase config schreiben
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > fuel-app/src/client/lib/firebase.config.js
          fi
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Build Fuel
        run: pnpm --filter ./fuel-app run build:cloud

      - name: Deploy Fuel to Firebase Hosting
        run: |
          cd fuel-app
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
