name: Close superseded Dependabot PRs

# Nach einem Bündel (vitalos#70) bleiben die einzelnen Dependabot-PRs offen,
# obwohl das Lockfile die Zielversionen schon hat. Dieser Lauf schließt nur
# solche PRs. Majors, die das Lockfile nicht enthält (#66), bleiben offen.
# Der Org-Bot fasst dependabot/* nicht an; das Schließen passiert hier.

on:
  push:
    branches: [master]
    paths:
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '.github/scripts/close-superseded-dependabot.py'
      - '.github/workflows/close-superseded-dependabot.yml'
  schedule:
    - cron: "17,47 5-19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Überholte Dependabot-PRs schließen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch || 'master' }}
        run: python3 .github/scripts/close-superseded-dependabot.py
