name: Deploy Habits PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'habit-app'
      - 'habit-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (Workspaces)
        run: npm ci

      # habit-app importiert @db/@utils, die auf fuel-devs Wrapper zeigen,
      # der wiederum @fitness-db komplett re-exportiert — zieht fitness-apps
      # generierten KB-Layer mit. Gitignored, wird sonst nur von fitness-apps
      # eigenem "prebuild"-Hook erzeugt.
      - name: Generate fitness KB data (transitive dependency via @fitness-db)
        run: npm run build:kb-data --workspace=fitness-app

      - name: Build Habits
        run: npm run build:firebase --workspace=habit-app

      - name: Deploy Habits to Firebase Hosting
        run: |
          cd habit-app
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
