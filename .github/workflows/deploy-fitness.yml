name: Deploy Fitness PWA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'fitness-app'
      - 'fitness-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (Workspaces)
        run: pnpm install --frozen-lockfile

      - name: Firebase config schreiben
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > fitness-app/firebase.config.js
          fi
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Debug firebase/util versions
        run: |
          echo "=== all @firebase/util package.json files ==="
          find . -path "*/node_modules/@firebase/util/package.json" -exec sh -c 'echo "--- {} ---"; grep "\"version\"" "{}"' \;
          echo "=== fitness-app node_modules/@firebase/util resolved path ==="
          readlink -f fitness-app/node_modules/@firebase/util || true
          echo "=== fitness-app node_modules/@firebase/firestore's own nested @firebase/util ==="
          find . -path "*@firebase+firestore*/node_modules/@firebase/util" -exec readlink -f {} \;
          echo "=== does index.esm.js exist anywhere? ==="
          find . -path "*@firebase/util*" -name "index.esm.js"
          echo "=== does it export updateEmulatorBanner? ==="
          grep -c "updateEmulatorBanner" node_modules/.pnpm/@firebase+util@1.12.1/node_modules/@firebase/util/dist/*.js 2>&1 || true
          ls node_modules/.pnpm/@firebase+util@1.12.1/node_modules/@firebase/util/dist/ 2>&1 || true

      - name: Build Fitness
        run: pnpm --filter ./fitness-app run build:firebase

      # KEIN firestore:rules/indexes mehr: Rules-SSOT ist ~/vitalos/firestore.rules,
      # deployed nur von deploy-shell.yml. Per-App-Rules haben sich gegenseitig
      # überschrieben (letzter Deploy gewann → fitness/kb-Reads verweigert).
      - name: Deploy Fitness to Firebase Hosting
        run: |
          cd fitness-app
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive
