# Living Dashboard → https://nimmsel23.github.io/vitalos/
# Engine + Doku: https://github.com/nimmsel23/dashboards/tree/engine
# Wie alle *-dev-Repos: Evidenz, Ampel, Pages. Branch master (Shell hat kein dev).
# Verlinkt die Dev-Boards der eingebundenen Submodule (fitness-dev, fuel-dev, …).
name: Dashboard
on:
  push:
    branches: [master]
  schedule:
    - cron: "40 4 * * 1" # Mo: mit Claude-Tiefenanalyse
    - cron: "40 4 * * 0,2-6"
  workflow_dispatch:
    inputs:
      deep:
        description: Claude-Tiefenanalyse jetzt ausführen
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  dashboard:
    uses: nimmsel23/dashboards/.github/workflows/repo-dashboard.yml@engine
    with:
      branch: master
      deep: ${{ github.event.schedule == '40 4 * * 1' || inputs.deep == true }}
    secrets: inherit
