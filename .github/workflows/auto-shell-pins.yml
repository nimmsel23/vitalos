name: Auto Shell Pins

# Mini-App-Gitlinks (Fuel eingeschlossen) auf den neuesten origin/master
# mit grünem Check-Job „check“ ziehen. Identität ist die bestehende GitHub
# App vitalos-org-bot (Variable ORG_BOT_APP_ID, Secret ORG_BOT_PRIVATE_KEY).
# Keine neuen Secrets. Code, der schon auf einem Dev-master liegt, wird hier
# nicht erneut gegen den Feature-Freeze geprüft.
#
# Schedule liegt auf Minute 17 und 47 zwischen 05 und 19 UTC (Winter:
# 06:17–20:47 Europe/Vienna), nie zur vollen Stunde. Ein einzelner Lauf
# „0 5 * * *“ ist seit Einführung des Workflows (23.11. 11:00 UTC) nicht
# angekommen; GitHub verzögert oder verwirft Slots zur vollen Stunde, und
# ein verpasster Tagesslot holt nichts nach. Mehrere Slots am Tag plus das
# idempotente Skript (kein zweiter PR, kein PR ohne Diff) fangen das auf.
#
# Zusätzlich repository_dispatch event_type=shell-pins. Ein Promote in einem
# *-dev-Repo kann den Bump damit ohne neues Secret anstoßen: dort liegt
# ORG_BOT_PRIVATE_KEY schon, Token via create-github-app-token mit
# repositories: vitalos, dann
#   gh api repos/nimmsel23/vitalos/dispatches -f event_type=shell-pins

on:
  schedule:
    - cron: "17,47 5-19 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [shell-pins]
  workflow_run:
    workflows: ["Deploy VitalOS Shell", "Product shared-source preparation"]
    types: [completed]

permissions:
  contents: read

# Bump-Läufe (schedule, dispatch) teilen sich eine Queue. Der Report-Job
# blockiert den Bump nicht.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'auto-shell-pins-report' || 'auto-shell-pins-bump' }}
  cancel-in-progress: false

jobs:
  bump:
    # Schedule, Dispatch und ein roter Deploy/Product-Lauf. Der Report-Job
    # allein hat ce2bd836 nicht zurückgesetzt: nach dem direkten Pin-Push
    # liefen nur workflow_run-Reports, und der letzte Bump (45479978566)
    # war am SSH-Klon der Submodule gescheitert.
    if: >-
      vars.ORG_BOT_APP_ID != '' &&
      (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.ORG_BOT_APP_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Pins setzen und PR öffnen
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/auto-shell-pins.sh

  report:
    if: github.event_name == 'workflow_run' && vars.ORG_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.ORG_BOT_APP_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Fehlgeschlagenen Pin-Deploy in ein Issue schreiben
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          REPORT: deploy
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/auto-shell-pins.sh
