# Managed dependency updates; vendored mini-app-shell copies are maintained at their source.
# CTO 2026-11-09: npm NUR vom Workspace-Root `/`.
# Hintergrund: Dependabot-Jobs „npm_and_yarn in /prod for vite|zod“ (Runs
# 42527900415 / 42527900307) scheiterten mit misconfigured_tooling — `/prod`
# liegt IN pnpm-workspace.yaml; Updates müssen über Root-Lockfile laufen.
# Unterverzeichnisse (/functions, /fuel-os, …) hier bewusst NICHT mehr gelistet,
# damit keine parallelen Subdir-Updater gegen den Workspace laufen.
version: 2
updates:
- package-ecosystem: github-actions
  schedule:
    interval: weekly
    day: monday
    time: 07:00
    timezone: Europe/Vienna
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
  directory: /
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: npm
  schedule:
    interval: weekly
    day: monday
    time: 07:00
    timezone: Europe/Vienna
  open-pull-requests-limit: 5
  commit-message:
    prefix: deps
  directory: /
  cooldown:
    default-days: 7
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
