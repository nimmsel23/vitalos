name: Skills submodule access
description: skills-dev is public. Submodule checkout uses HTTPS and a token; this step does not configure an SSH deploy key.
inputs:
  deploy-key:
    description: Unused. Workflows may still pass SKILLS_DEPLOY_KEY; it is ignored because the repository is public.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo '::notice::skills-dev ist öffentlich — Submodule-Checkout per HTTPS + Token. Kein Deploy-Key, kein Abruf von api.github.com/meta.'
