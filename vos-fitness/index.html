<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fitness VOS</title>
    <script>
      // vos-fitness ignoriert die fitness-app-Themes bewusst: immer "vos-pulse"
      // (src/styles/vos-pulse.css), auch wenn aus früheren Besuchen ein anderes
      // Theme oder der Circadian-Modus im localStorage steht. Die Theme-Auswahl
      // ist in Settings ausgeblendet (hideAppearance).
      try {
        localStorage.setItem('fitness-theme', 'vos-pulse');
        localStorage.setItem('fitness-theme-mode', 'manual');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', 'vos-pulse');
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          window.__swRegistration = reg
          const notify = () => window.dispatchEvent(new CustomEvent('sw-update-available'))
          if (reg.waiting) notify()
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing
            if (!nw) return
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) notify()
            })
          })
        }).catch(() => {})
        let reloading = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return
          reloading = true
          window.location.reload()
        })
      }
    </script>
  </body>
</html>
