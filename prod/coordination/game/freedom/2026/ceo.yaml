body_markdown: |-
  # CEO — Freedom Map (Annual Freedom Game)

  Single Freedom Goal (bis **2027-11-07**): VitalOS-Abos decken die Betriebskosten inkl. Claude-Max-Abo und fahren **Überschuss** ein.
  Kaskade (jede Ebene bricht die obere auf, nichts existiert parallel):

  | Ebene | Periode | Inhalt | Taskwarrior-Anker |
  | --- | --- | --- | --- |
  | Annual Freedom Game | bis 2027-11-07 | Abos ≥ Betriebskosten + Überschuss | Org-Task 1 (+freedom) |
  | Quartals-Fokus | Q4/2026 | M1-RC, M2-Testuser-Woche, Premium-Fundament | Org-Task 2 (+fokus) |
  | Monthly Mission | Nov / Dez | Nov: M1-RC steht + M2-Vorbereitung · Dez: Premium-Subscription live für Nicht-LLM-Nutzer | Org-Tasks 3/4 (+fire, +s) |
  | Weekly Doors | jede Woche So 12:00 | Domino Door + max. 2 Neben-Türen (War Stack s. ../fire/) | Org-Task 5 (+br) |

  Rahmen-Standard anch (Org-Task 6): Vibe als Org-Standard-Engine (Europa/DSGVO),
  Claude/Codex nur als Ausnahme — CTO setzt um, CEO entscheidet Ausnahmen.

  *Das Freedom-Ziel wird nicht delegiert und nicht terminiert — es wird bewegt,
  jede Ebene in ihrem Takt: GAME-Runde So 12:00 (Doors) → Monatsultimo
  (Mission) → Quartalsende (Fokus) → bis 2027-11-07 (Freedom).*
