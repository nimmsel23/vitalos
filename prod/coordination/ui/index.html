<!DOCTYPE html>

<head>

<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#lage" aria-label="VitalOS Lagezelt, zur Startansicht">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 3 28h26z" fill="var(--ember)"/>
          <path d="M16 13 11 28h10z" fill="var(--bg)"/>

        <span class="brand-text">
          <strong>Lagezelt</strong>
          <span>VitalOS · Koordination</span>
        </span>
      </a>
      <nav class="nav" aria-label="Ansichten">
        <a href="#lage" data-view="lage"><kbd>1</kbd><span>Lage</span></a>
        <a href="#rollen" data-view="rollen"><kbd>2</kbd><span>Rollen</span></a>
        <a href="#produkt" data-view="produkt"><kbd>3</kbd><span>Produkt</span></a>

        <p class="keys"><kbd>1</kbd>–<kbd>6</kbd> Ansicht · <kbd>/</kbd> Suche · <kbd>r</kbd> neu laden</p>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <div class="loading"><span></span><span></span><span></span></div>
    </main>

  <script type="module" src="./app.js"></script>
