    Die freiwilligen Testuser sind ein Geschenk mit Verfallsdatum: jede
    Wartewoche entsteht Vertrauenszins-Rückzahlungspflicht.
  impact_opening: >-
    M1-RC öffnet M2 (Testzyklus Simon & Matthias mit Debug-APK) und
    hebt den Meta-Release der Shell-Serie — der erste produktive
    Reifegrad-Nachweis für vitalos-prod überhaupt. Das ist
    Produktionsschicht, nicht Kosmetik.
  consequences: >-
    Der Emulator-Feed rostet (Zustände veralten, ältere Funde lassen sich
    nicht reproduzierbar nachweisen), die A11y-/Kosmetik-Findings bleiben
    unbestätigt, die Testuser verlieren Interesse — und die CEO-Rangfolge
    verliert ihr Wort. Wer die eigene Kaskade anschiebt, muss damit
    rechnen, dass die nächste Blocker-Meldung weniger Gehör findet.
