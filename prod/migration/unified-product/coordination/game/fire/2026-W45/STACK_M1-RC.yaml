    Vermeidungsgeschichte: "Ohne Owner-Weiter kann ich nichts tun, also
    berichte ich nochmal." Ehrliche Fassung: Warten ist hier keine Pflicht,
    sondern bequem — die Ursachendiagnose des Findings und die
    Timer-Vorbereitung liegen MITTEN in der CEO/Ausführungs-Linie, nicht
    im Owner-Gate. Nur die Endgenehmigung ist Daniels.
