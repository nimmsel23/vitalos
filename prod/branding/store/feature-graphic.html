<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>VitalOS Feature Graphic</title>
  <style>
    html, body {
      margin: 0;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #0a0515;
    }
    body {
      background:
        radial-gradient(820px 560px at 22% 46%, #3a2270 0%, #0a0515 72%),
        linear-gradient(102deg, #2e1a5c 0%, #170d33 52%, #0a0515 100%);
    }
    .lockup {
      box-sizing: border-box;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 52px;
      padding: 0 72px;
    }
    img {
      width: 292px;
      height: 292px;
      display: block;
    }
    .word {
      margin: 0;
      font-family: Inter, "Noto Sans", sans-serif;
      font-weight: 650;
      font-size: 104px;
      letter-spacing: -0.045em;
      line-height: 0.9;
      color: #f4effa;
    }
  </style>
</head>
<body>
  <div class="lockup">
    <img src="../../public/icon.svg" alt="">
    <p class="word">VitalOS</p>
  </div>
</body>
</html>
